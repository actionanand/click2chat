<button
  #trigger
  type="button"
  class="picker-trigger"
  [class.compact]="compact()"
  [disabled]="disabled()"
  [attr.aria-expanded]="open()"
  aria-haspopup="dialog"
  (click)="openPicker()"
>
  @if (selectedOption()?.icon; as icon) {
    <app-icon [name]="icon" />
  }
  <span>{{ selectedOption()?.label ?? placeholder() }}</span>
  <app-icon name="chevron-down" />
</button>

@if (open()) {
  <dialog
    #dialog
    class="picker-dialog"
    [attr.aria-label]="sheetTitle()"
    (cancel)="handleCancel($event)"
  >
    <button
      class="picker-backdrop"
      type="button"
      aria-label="Close options"
      (click)="close()"
    ></button>
    <div class="picker-sheet">
      <header>
        <strong>{{ sheetTitle() }}</strong>
        <button type="button" aria-label="Close options" (click)="close()">
          <app-icon name="close" />
        </button>
      </header>
      @if (searchable()) {
        <label class="picker-search">
          <span class="visually-hidden">Search {{ sheetTitle() }}</span>
          <app-icon name="search" />
          <input
            #searchInput
            type="search"
            autocomplete="off"
            enterkeyhint="search"
            placeholder="Search countries or codes"
            [value]="search()"
            (input)="updateSearch($event)"
          />
        </label>
      }
      <div class="picker-options" role="listbox" [attr.aria-label]="sheetTitle()">
        @for (option of filteredOptions(); track option.value) {
          <button
            type="button"
            class="picker-option"
            [class.selected]="option.value === value()"
            [disabled]="option.disabled"
            role="option"
            [attr.aria-selected]="option.value === value()"
            (click)="select(option.value)"
          >
            @if (option.icon) {
              <span class="option-icon"><app-icon [name]="option.icon" /></span>
            }
            <span class="option-copy">
              <strong>{{ option.label }}</strong>
              @if (option.detail) {
                <small>{{ option.detail }}</small>
              }
            </span>
            @if (option.value === value()) {
              <app-icon class="option-check" name="check" />
            }
          </button>
        } @empty {
          <p class="empty-options">No matching options</p>
        }
      </div>
    </div>
  </dialog>
}
